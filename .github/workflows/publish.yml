name: Publish
on:
  release:
    types: [created]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: NPM_AUTH_TOKEN
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing + npm provenance
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify SDK and packaged examples
        run: npm run verify

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Get current package version
        id: current_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Get published version
        id: published_version
        run: |
          PUBLISHED_VERSION=$(npm view @usagey/sdk version 2>/dev/null || echo "0.0.0")
          echo "version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: version_check
        run: |
          CURRENT="${{ steps.current_version.outputs.version }}"
          PUBLISHED="${{ steps.published_version.outputs.version }}"
          echo "Current version: $CURRENT"
          echo "Published version: $PUBLISHED"

          if [ "$CURRENT" != "$PUBLISHED" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "New version detected - will publish"
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "No version change - skipping publish"
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --access public --provenance